{% extends "base.html" %}
{% block title %}{% block sms_title %}SMS Deliverability{% endblock %} — Pipes QA{% endblock %}
{% block breadcrumb %}SMS / Telgorithm{% endblock %}

{% block extra_styles %}
<style>
  /* ── SMS-specific overrides for portal Berry theme ─────────────── */

  .badge-delivered { background: var(--green-bg);  color: var(--green);  border-color: var(--green-border); }
  .badge-failed    { background: var(--red-bg);    color: var(--red);    border-color: var(--red-border); }
  .badge-other     { background: var(--surface2);  color: var(--text-muted); border-color: var(--border); }
  .badge-warn      { background: var(--yellow-bg); color: var(--yellow); border-color: var(--yellow-border); }

  .stat-bar { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius-sm); padding: 14px 20px; box-shadow: var(--shadow-xs); }
  .stat-value { font-size: 22px; font-weight: 700; color: var(--text); }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .date-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border-light);
    border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 20px;
    box-shadow: var(--shadow-xs);
  }
  .date-bar-label { font-size: 12px; color: var(--text-muted); font-weight: 500; white-space: nowrap; }
  .date-chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .date-chip {
    padding: 4px 12px; border-radius: 20px; font-size: 12px; font-family: var(--mono);
    text-decoration: none; border: 1px solid var(--border); color: var(--text-muted);
    transition: all .15s; white-space: nowrap;
  }
  .date-chip:hover { border-color: var(--purple); color: var(--purple); }
  .date-chip.active { background: var(--purple); border-color: var(--purple); color: #fff; }

  .view-toggle { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-xs); padding: 3px; }
  .view-btn { padding: 5px 14px; border-radius: 4px; text-decoration: none; font-size: 13px; font-weight: 500; color: var(--text-secondary); transition: all .15s; }
  .view-btn.active { background: var(--purple); color: #fff; box-shadow: 0 2px 6px rgba(94,53,177,.35); }
  .view-btn:not(.active):hover { color: var(--purple); background: var(--purple-dim); }

  .pagination { display: flex; align-items: center; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
  .pagination a, .pagination span { padding: 6px 12px; border-radius: var(--radius-xs); font-size: 13px; text-decoration: none; }
  .pagination a { color: var(--text-secondary); border: 1px solid var(--border); }
  .pagination a:hover { background: var(--purple-dim); color: var(--purple); }
  .pagination .current { background: var(--purple); color: #fff; border: 1px solid var(--purple); }
  .pagination .dots { color: var(--text-muted); }

  td { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  input[type="date"], input[type="month"] {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: var(--radius-xs); padding: 4px 10px; font-size: 12px; font-family: var(--mono);
    cursor: pointer; transition: border-color .15s;
  }
  input[type="date"]:focus, input[type="month"]:focus { border-color: var(--purple); outline: none; }

  .file-zone {
    border: 2px dashed var(--border); border-radius: var(--radius-sm);
    padding: 40px 24px; text-align: center; cursor: pointer;
    transition: border-color .2s, background .2s; position: relative;
  }
  .file-zone:hover, .file-zone.dragover { border-color: var(--purple); background: var(--purple-dim); }
  .file-zone input[type="file"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .file-zone-icon { font-size: 32px; margin-bottom: 12px; }
  .file-zone-label { font-size: 15px; font-weight: 500; }
  .file-zone-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .file-name-display { margin-top: 12px; font-size: 13px; color: var(--purple); font-family: var(--mono); }

  .hint-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
  .hint-tag { background: var(--purple-light); border: 1px solid rgba(94,53,177,.2); color: var(--purple); font-family: var(--mono); font-size: 12px; padding: 4px 10px; border-radius: var(--radius-xs); }
</style>
{% endblock %}
