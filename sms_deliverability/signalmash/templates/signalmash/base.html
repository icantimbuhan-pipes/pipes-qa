<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SMS Deliverability{% endblock %} — Pipes QA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
      --accent: #5b6af0; --accent-hover: #4a59df;
      --text: #e2e4ef; --text-muted: #6b7280;
      --success-bg: #0d2b1e; --success-border: #15803d; --success-text: #4ade80;
      --error-bg: #2b0d0d; --error-border: #b91c1c; --error-text: #f87171;
      --row-hover: #20233a;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: "SF Mono", "Fira Code", Consolas, monospace;
    }
    html, body { height: 100%; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; min-height: 100%; }
    nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; gap: 16px; height: 52px; }
    .nav-brand { font-size: 13px; font-weight: 600; color: var(--text-muted); letter-spacing: .04em; text-transform: uppercase; text-decoration: none; }
    .nav-sep { color: var(--border); }
    .nav-module { font-size: 14px; font-weight: 600; color: var(--text); text-decoration: none; }
    .nav-links { margin-left: auto; display: flex; gap: 4px; }
    .nav-link { padding: 6px 12px; border-radius: 6px; text-decoration: none; color: var(--text-muted); font-size: 13px; transition: background .15s, color .15s; }
    .nav-link:hover, .nav-link.active { background: rgba(91,106,240,.15); color: var(--accent); }
    .nav-divider { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
    .page { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
    .page-header { margin-bottom: 24px; }
    .page-header h1 { font-size: 20px; font-weight: 600; }
    .page-header p { color: var(--text-muted); margin-top: 4px; font-size: 13px; }
    .flash { border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; font-size: 13px; border: 1px solid; }
    .flash.success { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
    .flash.error   { background: var(--error-bg);   border-color: var(--error-border);   color: var(--error-text); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 20px; border-radius: 7px; border: none; font-size: 14px; font-weight: 500; cursor: pointer; transition: background .15s; text-decoration: none; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--surface); color: var(--text); }
    .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead { background: rgba(255,255,255,.03); }
    th { padding: 10px 12px; text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 9px 12px; border-bottom: 1px solid rgba(42,45,58,.6); max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--row-hover); }
    .mono { font-family: var(--mono); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
    .badge-delivered { background: #0d2b1e; color: #4ade80; }
    .badge-failed    { background: #2b0d0d; color: #f87171; }
    .badge-other     { background: #1e1e2e; color: #a0aec0; }
    .pagination { display: flex; align-items: center; gap: 8px; margin-top: 20px; }
    .pagination a, .pagination span { padding: 6px 12px; border-radius: 6px; font-size: 13px; text-decoration: none; }
    .pagination a { color: var(--text-muted); border: 1px solid var(--border); }
    .pagination a:hover { background: var(--surface); color: var(--text); }
    .pagination .current { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
    .pagination .dots { color: var(--text-muted); }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 20px; }
    .stat-value { font-size: 22px; font-weight: 700; color: var(--text); }
    .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .empty-state { text-align: center; padding: 64px 24px; color: var(--text-muted); }
    .empty-state p { margin-top: 8px; font-size: 13px; }
    .empty-state a { color: var(--accent); text-decoration: none; }
    .date-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-bottom: 20px; }
    .date-bar-label { font-size: 12px; color: var(--text-muted); font-weight: 500; white-space: nowrap; }
    .date-chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
    .date-chip { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-family: var(--mono); text-decoration: none; border: 1px solid var(--border); color: var(--text-muted); transition: all .15s; white-space: nowrap; }
    .date-chip:hover { border-color: var(--accent); color: var(--accent); }
    .date-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    input[type="date"] { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 10px; font-size: 12px; font-family: var(--mono); cursor: pointer; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.7); cursor: pointer; }
  </style>
</head>
<body>

<nav>
  <a class="nav-brand" href="/">Pipes QA</a>
  <span class="nav-sep">›</span>
  <a class="nav-module" href="/upload">SMS Deliverability</a>
  <div class="nav-links">
    <a class="nav-link {% if request.endpoint == 'upload' %}active{% endif %}" href="/upload">Upload</a>
    <div class="nav-divider"></div>
    <a class="nav-link {% if request.endpoint and request.endpoint.startswith('telgorithm.') %}active{% endif %}"
       href="{{ url_for('telgorithm.reports') }}">Telgorithm</a>
    <a class="nav-link {% if request.endpoint and request.endpoint.startswith('signalmash.') %}active{% endif %}"
       href="{{ url_for('signalmash.reports') }}">Signalmash</a>
  </div>
</nav>

<div class="page">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>

</body>
</html>
