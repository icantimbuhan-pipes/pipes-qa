[project]
name = "pipes-qa"
version = "0.1.0"
description = "Pipes QA — daily outbound call monitoring, AMD detection, and Slack reporting"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-html>=4.1",
    "slack-bolt>=1.18",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, no network",
    "integration: hits the Pipes API",
]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
