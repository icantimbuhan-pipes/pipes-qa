<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Pipes.QA Portal{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:             #0f1117;
      --surface:        #1a1d27;
      --surface2:       #20233a;
      --border:         #2a2d3a;
      --accent:         #5b6af0;
      --accent-hover:   #4a59df;
      --accent-dim:     rgba(91,106,240,.12);
      --green:          #4ade80;
      --green-bg:       #0d2b1e;
      --green-border:   #15803d;
      --red:            #f87171;
      --red-bg:         #2b0d0d;
      --red-border:     #b91c1c;
      --yellow:         #fbbf24;
      --text:           #e2e4ef;
      --text-muted:     #6b7280;
      --font:           -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono:           "SF Mono", "Fira Code", Consolas, monospace;
    }

    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100%;
    }

    /* ── Nav ── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 52px;
      position: sticky;
      top: 0;
      z-index: 100;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    nav::-webkit-scrollbar { display: none; }
    .nav-brand {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: .02em;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }
    .nav-brand-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }
    .nav-sep { color: var(--border); margin: 0 4px; flex-shrink: 0; }
    .nav-links { margin-left: auto; display: flex; gap: 2px; align-items: center; flex-shrink: 0; }
    .nav-divider { width: 1px; height: 20px; background: var(--border); margin: 0 6px; flex-shrink: 0; }
    .nav-link {
      padding: 6px 10px;
      border-radius: 6px;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 13px;
      transition: background .15s, color .15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .nav-link:hover { background: var(--accent-dim); color: var(--text); }
    .nav-link.active { background: var(--accent-dim); color: var(--accent); font-weight: 500; }

    /* ── Page ── */
    .page { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
    .page-sm { max-width: 700px; margin: 0 auto; padding: 24px 16px; }

    @media (min-width: 640px) {
      nav { padding: 0 24px; }
      .page { padding: 36px 24px; }
      .page-sm { padding: 36px 24px; }
    }
    .page-header { margin-bottom: 28px; }
    .page-header h1 { font-size: 22px; font-weight: 700; }
    .page-header p { color: var(--text-muted); margin-top: 5px; font-size: 13px; }

    /* ── Flash ── */
    .flash { border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; font-size: 13px; border: 1px solid; }
    .flash.success { background: var(--green-bg);  border-color: var(--green-border); color: var(--green); }
    .flash.error   { background: var(--red-bg);    border-color: var(--red-border);   color: var(--red); }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 20px;
      border-radius: 7px; border: none;
      font-size: 14px; font-weight: 500;
      cursor: pointer; transition: background .15s, opacity .15s;
      text-decoration: none; white-space: nowrap;
    }
    .btn-primary   { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-success   { background: #15803d; color: #fff; }
    .btn-success:hover { background: #166534; }
    .btn-danger    { background: #b91c1c; color: #fff; }
    .btn-danger:hover { background: #991b1b; }
    .btn-ghost {
      background: transparent; color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--surface); color: var(--text); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead { background: rgba(255,255,255,.025); }
    th {
      padding: 10px 14px;
      text-align: left;
      font-size: 11px; font-weight: 600;
      letter-spacing: .06em; text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(42,45,58,.6);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--surface2); }
    .mono { font-family: var(--mono); }

    /* ── Badges ── */
    .badge {
      display: inline-block; padding: 2px 9px; border-radius: 5px;
      font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    }
    .badge-pass    { background: var(--green-bg); color: var(--green); }
    .badge-fail    { background: var(--red-bg);   color: var(--red); }
    .badge-partial { background: rgba(251,191,36,.12); color: var(--yellow); }
    .badge-pending { background: rgba(107,114,128,.15); color: var(--text-muted); }
    .badge-blue    { background: var(--accent-dim); color: var(--accent); }

    /* ── Progress bar ── */
    .progress-wrap {
      background: var(--surface2);
      border-radius: 99px; height: 6px;
      overflow: hidden; margin-bottom: 4px;
    }
    .progress-bar {
      height: 100%; border-radius: 99px;
      background: var(--accent);
      transition: width .3s ease;
    }

    /* ── Misc ── */
    .empty-state { text-align: center; padding: 56px 24px; color: var(--text-muted); }
    .empty-state p { margin-top: 8px; font-size: 13px; }
    .empty-state a { color: var(--accent); text-decoration: none; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    textarea, input[type="text"] {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); border-radius: 7px; padding: 9px 12px;
      font-size: 14px; font-family: var(--font); resize: vertical;
    }
    textarea:focus, input[type="text"]:focus { outline: none; border-color: var(--accent); }
  </style>
</head>
<body>

<nav>
  <a class="nav-brand" href="/">
    <span class="nav-brand-dot"></span>
    Pipes.QA Portal
  </a>
  <div class="nav-links">
    <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}" href="/">Dashboard</a>
    <a class="nav-link {% if request.endpoint and request.endpoint.startswith('daily_qa.') %}active{% endif %}"
       href="{{ url_for('daily_qa.pick') }}">Daily QA</a>
    <a class="nav-link {% if request.endpoint and request.endpoint.startswith('daily_qa.') and 'hourly' in (request.args.get('preset','') or session_checklist_key|default('')) %}active{% endif %}"
       href="{{ url_for('daily_qa.pick', preset='hourly-heavy-khomp') }}">Hourly QA</a>
    <div class="nav-divider"></div>
    <a class="nav-link {% if request.endpoint == 'upload' %}active{% endif %}" href="/upload">SMS</a>
    <div class="nav-divider"></div>
    <a class="nav-link {% if request.endpoint and request.endpoint.startswith('validator.') %}active{% endif %}"
       href="{{ url_for('validator.index') }}">🧪 Validator</a>
    <a class="nav-link {% if request.endpoint and request.endpoint.startswith('maintenance.') %}active{% endif %}"
       href="{{ url_for('maintenance.index') }}">⚙ Maintenance</a>
  </div>
</nav>

<div class="{% block page_class %}page{% endblock %}">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>

</body>
</html>
