<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — Pipes.QA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple:       #5e35b1;
      --purple-dark:  #4527a0;
      --purple-glow:  rgba(94,53,177,.22);
      --bg:           #f4f6fc;
      --surface:      #ffffff;
      --border:       #e0e0e0;
      --text:         #212121;
      --text-muted:   #9e9e9e;
      --red:          #c62828;
      --red-bg:       #ffebee;
      --red-border:   #ef9a9a;
      --font: 'Roboto', system-ui, sans-serif;
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .wrap { width: 100%; max-width: 400px; }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-logo {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #5e35b1 0%, #9c27b0 100%);
      border-radius: 14px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 800; color: #fff;
      box-shadow: 0 6px 20px rgba(94,53,177,.4);
      margin-bottom: 12px;
      letter-spacing: -.5px;
    }
    .brand-name { font-size: 20px; font-weight: 700; color: var(--text); }
    .brand-sub  { font-size: 11px; color: var(--text-muted); letter-spacing: .1em; margin-top: 2px; }

    .card {
      background: var(--surface);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 24px rgba(0,0,0,.1);
      border: 1px solid var(--border);
    }
    .card h2 { font-size: 17px; font-weight: 600; margin-bottom: 5px; }
    .card p  { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }

    .field { margin-bottom: 16px; }
    label {
      display: block; font-size: 12px; font-weight: 500;
      color: #616161; margin-bottom: 5px;
    }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%; padding: 10px 13px; font-size: 14px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: var(--font);
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus {
      outline: none;
      border-color: var(--purple);
      box-shadow: 0 0 0 3px var(--purple-glow);
      background: #fff;
    }
    .btn {
      width: 100%; padding: 11px;
      background: var(--purple); color: #fff;
      border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      font-family: var(--font); letter-spacing: .01em;
      box-shadow: 0 3px 12px rgba(94,53,177,.4);
      transition: background .15s, transform .1s;
      margin-top: 6px;
    }
    .btn:hover { background: var(--purple-dark); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .error {
      background: var(--red-bg);
      border: 1px solid var(--red-border);
      border-radius: 8px; padding: 10px 14px;
      font-size: 13px; color: var(--red);
      margin-bottom: 16px;
    }

    .hint {
      margin-top: 20px; padding: 10px 14px;
      background: #f8f9fa; border: 1px solid #e8e8e8;
      border-radius: 8px; font-size: 11.5px;
      color: var(--text-muted); text-align: center;
      line-height: 1.6;
    }
    .hint code {
      font-family: "SF Mono", Consolas, monospace;
      color: var(--purple); font-size: 11px;
    }
  </style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="brand-logo">P</div>
    <div class="brand-name">Pipes.QA</div>
    <div class="brand-sub">QA PORTAL</div>
  </div>

  <div class="card">
    <h2>Sign in</h2>
    <p>Enter your credentials to continue.</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
      <div class="field">
        <label for="email">Email or username</label>
        <input type="text" id="email" name="email" required
          placeholder="admin@pipes.ai" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required
          placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn">Sign in →</button>
    </form>

    <div class="hint">
      Default admin — <code>admin@pipes.ai</code> / <code>admin123</code><br>
      Change the password in Admin → Users after first login.
    </div>
  </div>

</div>
</body>
</html>
